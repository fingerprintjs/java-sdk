name: Dependency verification metadata

on:
  pull_request:
    paths:
      - 'gradle/**'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'jitpack.yml'
      - '.github/workflows/verification-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check dependency verification metadata
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 11

      # Start from empty Gradle and Maven caches so every downloaded file is recorded, and
      # remove the old file so entries for removed dependencies are dropped.
      - name: Regenerate verification metadata
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home
          MAVEN_REPO_LOCAL: ${{ runner.temp }}/m2
        run: |
          rm gradle/verification-metadata.xml
          ./gradlew -Dmaven.repo.local="$MAVEN_REPO_LOCAL" --write-verification-metadata sha256 build
          # Repeat the JitPack build (jitpack.yml) so its files are recorded too
          JITPACK=true ./gradlew -Dmaven.repo.local="$MAVEN_REPO_LOCAL" --write-verification-metadata sha256 clean build sdk:publishToMavenLocal

      - name: Check for changes
        id: diff
        run: git diff --exit-code gradle/verification-metadata.xml

      - name: Upload regenerated verification metadata
        if: failure() && steps.diff.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: verification-metadata
          path: gradle/verification-metadata.xml
