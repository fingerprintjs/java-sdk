name: Test

on:
  push:
    branches-ignore:
      - main

jobs:
  format-check:
    runs-on: ubuntu-latest
    name: Check source code formatting
    steps:
      - uses: actions/checkout@v7
      - run: ./gradlew :sdk:checkFormat :examples:checkFormat --continue

  test:
    runs-on: ubuntu-latest
    name: Java ${{ matrix.java }}
    strategy:
      matrix:
        java: ['11', '17', '21', '25']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          # Last version becomes JAVA_HOME and runs Gradle (needs 17+); matrix version is picked up as toolchain
          java-version: |
            ${{ matrix.java }}
            21
        # Gradle will detect the JVM installation from the ubuntu-latest image and use it
        # includes execution of unit tests
      - run: ./gradlew build -PjavaVersion=${{ matrix.java }} --stacktrace

  jitpack-build:
    runs-on: ubuntu-latest
    name: Jitpack build smoke test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          # 17 runs Gradle, 11 is used as toolchain
          java-version: |
            11
            17
      - run: ./gradlew clean build -PjavaVersion=11 --stacktrace
        env:
          JITPACK: true
      - run: ./gradlew sdk:publishToMavenLocal -PjavaVersion=11 --stacktrace
        env:
          JITPACK: true
